version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/moltis.lpk

update:
  strategy: publish
  version_source:
    type: image
    image: moltis

build:
  run_buildscript: false

images:
  - id: moltis
    target: service
    service: moltis
    source: ghcr.io/moltis-org/moltis
    channel: custom
    sort: created
    tag_regex: '^\d{8}\.\d+$'
    version_regex: '^(?P<version>\d{8})\.0*(?P<build>[1-9]\d*)$'
    version_template: '{version}.{build}.0'
    delivery:
      mode: lazycat

stores:
  official:
    enabled: true
    skip_if_version_exists: true
    create_if_missing: false
    changelog_locales: [zh, en]
  private:
    enabled: true
    skip_if_version_exists: true
    name: Moltis
    summary: Published from GitHub Actions
